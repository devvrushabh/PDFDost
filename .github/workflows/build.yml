name: Build Flutter APK & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Project
        run: |
          rm -rf android
          flutter create . --org com.devvrushabh --project-name pdfdost --platforms android
          bash android_custom/configure_android.sh

      - name: Get Dependencies
        run: flutter pub get

      - name: Patch Plugin SDKs
        run: bash android_custom/patch_plugins.sh

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfdost-flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Prepare Release APK Asset
        id: prep
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/heads/* ]] || [[ -z "${TAG}" ]]; then
            TAG="v1.0.0"
          fi
          APK_NAME="PDFDost-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "PDFDost ${{ steps.prep.outputs.tag }}"
          body: |
            ## PDFDost ${{ steps.prep.outputs.tag }} 📄✨
            
            **100% Free Forever • Privacy-First • Offline-First Document & PDF Utility**  
            *Crafted with dedication by **Vrushabh Dhote***
            
            ---
            
            ### 🚀 What's Included in this Release
            - 📑 **Complete 12-Tool PDF & Office Suite**:
              - **Images to PDF**: Convert photos/scans to PDF with custom margins and page sizes.
              - **Word to PDF**: Convert `.docx`, `.doc`, spreadsheets (`.xlsx`, `.xlsm`, `.xlsb`, `.xls`, `.csv`), and text formats (`.txt`, `.xml`, `.ods`, `.prn`).
              - **Merge PDF**: Merge multiple PDF files with hold-and-drag reordering.
              - **Split PDF**: Split by specific pages or custom page ranges (`1-3, 5, 8-10`).
              - **PDF to Word**: Convert PDFs into editable Microsoft Word documents (`.docx`).
              - **PDF to PowerPoint**: Convert presentation slides into PowerPoint (`.pptx`).
              - **PDF to Excel**: Extract tabular data into Excel spreadsheets (`.xlsx`).
              - **PDF to JPG**: Extract high-resolution image pages (JPEG).
              - **Page Numbers**: Add headers/footers with alignment and custom prefix options.
              - **Watermark PDF**: Safeguard documents with custom text, angle, and opacity.
              - **Rotate PDF**: Rotate all pages (90°, 180°, 270°) to correct orientation.
              - **Lock PDF**: Secure documents with strong password protection.
            - 📁 **Organized Folders & Document Sets**: Group multiple photos into document sets with color-coded custom folders and quick inline filtering.
            - 🔄 **Hold-and-Drag Reordering**: Rearrange file and page order across all tools before converting.
            - 🗑️ **30-Day Trash Auto-Retention**: Files are safely retained for 30 days before permanent deletion, with instant 1-tap restore.
            - 🔒 **100% Local & Offline**: All processing happens entirely on your device. Zero cloud uploads.
            - 🎨 **Material 3 UI**: Clean navigation, Light & Dark modes, and ad-free experience.
            
            ---
            
            ### 📥 Download & Installation
            Download the attached **`PDFDost-${{ steps.prep.outputs.tag }}.apk`** below to install directly on your Android device (Android 7.0+).
          draft: false
          prerelease: false
          files: ${{ steps.prep.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

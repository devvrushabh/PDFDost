name: pdfdost
description: "PDFDost - High quality Image to PDF converter and complete document utility app"
publish_to: "none"
version: 1.1.1+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  open_filex: ^4.5.0
  printing: ^5.13.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  syncfusion_flutter_pdf: ^26.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/upi_qr.png
    - PDFDost-icon.png

dependency_overrides:
  archive: ^4.5.2

